<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
</head>

<body>

    <div class="container">

        <h1>🌤 SkyCast Weather</h1>

        <div class="search-box">

            <input type="text"
                id="cityInput"
                placeholder="Enter city or place name (e.g., Goa, Mumbai, Delhi)">

            <button id="searchBtn">Search</button>

        </div>

        <p id="errorMessage"></p>

        <div class="weather-box">

            <!-- Default text before search -->
            <h2 id="cityName">Search Weather</h2>

            <p id="dateTime"></p>

            <img id="weatherIcon" src="" alt="Weather Icon">

            <h1 id="temperature">--°C</h1>

            <p id="description">Weather Description</p>

            <div class="details">

                <div class="card">
                    <h3>Humidity</h3>
                    <p id="humidity">--%</p>
                </div>

                <div class="card">
                    <h3>Wind Speed</h3>
                    <p id="wind">-- km/h</p>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
